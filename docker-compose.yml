services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sozlesme_analizi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - APP_NAME=Sozlesme Analizi Sistemi
      - APP_VERSION=0.1.0
      - DEBUG=true
      - SECRET_KEY=change-this-to-a-secure-random-string
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ALGORITHM=HS256
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - DATABASE_URL=postgresql+asyncpg://user:password@localhost:5432/sozlesme_db
      - UPLOAD_DIR=uploads
      - MAX_UPLOAD_SIZE_MB=50
    networks:
      - legal-network
    restart: unless-stopped

networks:
  legal-network:
    driver: bridge
