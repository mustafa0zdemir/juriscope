<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Sözleşme Analizi Sistemi mimarisi</title>
  <description id="description">React arayüzünden FastAPI ve RAG orkestrasyonuna, oradan PostgreSQL, MinIO, Qdrant ve Gemini servislerine uzanan sistem akışı.</description>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Çok Kaynaklı Hukuk RAG Mimarisi</text>
  <text x="60" y="88" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="15">Sözleşme ve hukuk kaynaklarından doğrulanabilir cevap üretim akışı</text>

  <g filter="url(#shadow)">
    <rect x="60" y="140" width="210" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="60" y="140" width="8" height="130" rx="4" fill="#dc1e32"/>
    <text x="88" y="180" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">React + TypeScript</text>
    <text x="88" y="210" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Dashboard ve analiz ekranları</text>
    <text x="88" y="235" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Streaming hukuk asistanı</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="140" width="210" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="355" y="140" width="8" height="130" rx="4" fill="#263b52"/>
    <text x="383" y="180" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">FastAPI</text>
    <text x="383" y="210" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">JWT ve yetkilendirme</text>
    <text x="383" y="235" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">REST API + SSE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="125" width="260" height="160" rx="16" fill="#263b52"/>
    <text x="680" y="168" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">RAG Orkestrasyonu</text>
    <text x="680" y="201" fill="#dbe5ef" font-family="Inter,Arial,sans-serif" font-size="14">Hybrid Search + Re-ranking</text>
    <text x="680" y="226" fill="#dbe5ef" font-family="Inter,Arial,sans-serif" font-size="14">Context + Prompt + Citation</text>
    <text x="680" y="251" fill="#dbe5ef" font-family="Inter,Arial,sans-serif" font-size="14">Guardrails + güven kontrolleri</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="995" y="140" width="145" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1022" y="180" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Gemini</text>
    <text x="1022" y="210" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Doğal dil</text>
    <text x="1022" y="235" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">cevap üretimi</text>
  </g>

  <path d="M270 205 H345" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M565 205 H640" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M910 205 H985" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="287" y="190" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">HTTP / SSE</text>

  <path d="M780 285 V338" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1068 270 V315 H900 V338" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="95" y="365" width="220" height="120" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="125" y="405" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">PostgreSQL</text>
    <text x="125" y="435" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Kullanıcı, sözleşme, chunk</text>
    <text x="125" y="460" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">sohbet ve denetim kayıtları</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="365" width="190" height="120" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="420" y="405" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">MinIO</text>
    <text x="420" y="435" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Sözleşme ve hukuk</text>
    <text x="420" y="460" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">belgelerinin dosyaları</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="655" y="365" width="190" height="120" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="685" y="405" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Qdrant</text>
    <text x="685" y="435" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Sözleşme ve hukuk</text>
    <text x="685" y="460" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">kaynağı vektörleri</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="920" y="365" width="220" height="120" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="950" y="405" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">BGE Modelleri</text>
    <text x="950" y="435" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Embedding ve Cross Encoder</text>
    <text x="950" y="460" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">yeniden sıralama</text>
  </g>

  <path d="M750 338 L205 355" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750 338 L485 355" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M780 338 L750 355" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M810 338 L1030 355" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
